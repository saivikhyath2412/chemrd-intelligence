[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chemrd-intelligence"
version = "0.1.0"
description = "Provenance-aware chemistry R&D intelligence MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]
postgres = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "pgvector>=0.3,<1",
]
chemistry = [
  "rdkit>=2023.9",
]
desktop = [
  "pywebview>=6,<7",
  "pyinstaller>=6,<7",
]
ai = [
  "openai>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
